services:
  api:
    build: .
    container_name: ecommerce_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: ecommerce_tests
    volumes:
      - .:/app
      - ./htmlcov:/app/htmlcov
    environment:
      - PYTHONPATH=/app
