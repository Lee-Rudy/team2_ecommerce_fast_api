name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Lint
        run: poetry run flake8 app tests

      - name: Format check
        run: poetry run black --check app tests

      - name: Type check
        run: poetry run mypy app


  test:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run tests with coverage
        run: |
          poetry run pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=term:skip-covered \
            --cov-fail-under=80
      
      - name: Coverage Summary
        if: always()
        run: |
          echo "==================================="
          echo "Coverage report completed"
          echo "==================================="
